[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "neuton-supermarket-ingestor"
version = "0.1.0"
description = "Sampled supermarket catalog ingestion worker"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "hatchling==1.30.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ingestor"]
