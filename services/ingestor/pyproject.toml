[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "neuton-supermarket-ingestor"
version = "0.1.0"
description = "Sampled supermarket catalog ingestion worker"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "defusedxml==0.7.1", "tzdata==2026.6"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "hatchling==1.30.1"]
probe = ["israeli-prices==0.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "../../Temp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ingestor"]
