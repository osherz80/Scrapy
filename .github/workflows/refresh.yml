name: Supermarket refresh
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      mode:
        description: Full refresh (writes products), or source-only probe/pilot
        type: choice
        options:
          - refresh
          - probe
          - pilot
        default: refresh
        required: true
      run_id:
        description: Optional API-admitted run ID; leave blank for a full refresh
        type: string
        required: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TEMP: ${{ github.workspace }}/Temp
      TMP: ${{ github.workspace }}/Temp
      TMPDIR: ${{ github.workspace }}/Temp
      UV_CACHE_DIR: ${{ github.workspace }}/Temp/uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime/python
      UV_PYTHON_BIN_DIR: ${{ github.workspace }}/.runtime/bin
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv312
      LOG_ENV: production
      LOG_PROVIDER: console
      LOG_LEVEL: info
      RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      AUTHORIZED_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate invocation
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME:$RUN_MODE" in
            schedule:scheduled|workflow_dispatch:probe|workflow_dispatch:pilot) ;;
            workflow_dispatch:refresh) ;;
            *) echo 'Unsupported workflow mode' >&2; exit 2 ;;
          esac
      - uses: ./.github/actions/setup-ingestor
      - name: Bounded source diagnostic
        if: env.RUN_MODE == 'probe'
        run: .venv312/bin/python -m ingestor.cli probe --max-branches 1
      - name: Production collection pilot without database access
        if: env.RUN_MODE == 'pilot'
        run: .venv312/bin/python -m ingestor.cli pilot
      - name: Refresh authorized or scheduled run
        if: env.RUN_MODE == 'refresh' || env.RUN_MODE == 'scheduled'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          DATABASE_SSLROOTCERT: Temp/database-ca.crt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_CA_CERT" ]]; then
            echo 'Missing DATABASE_CA_CERT repository secret' >&2
            exit 2
          fi
          mkdir -p Temp
          umask 077
          trap 'rm -f -- Temp/database-ca.crt' EXIT
          printf '%s\n' "$DATABASE_CA_CERT" > "$DATABASE_SSLROOTCERT"
          unset DATABASE_CA_CERT
          if ! openssl x509 -in "$DATABASE_SSLROOTCERT" -noout >/dev/null 2>&1; then
            echo 'DATABASE_CA_CERT must contain a PEM certificate' >&2
            exit 2
          fi
          case "$RUN_MODE" in
            scheduled) .venv312/bin/python -m ingestor.cli scheduled ;;
            refresh)
              if [[ -n "$AUTHORIZED_RUN_ID" ]]; then
                .venv312/bin/python -m ingestor.cli refresh --run-id "$AUTHORIZED_RUN_ID"
              else
                .venv312/bin/python -m ingestor.cli refresh
              fi
              ;;
            *) exit 2 ;;
          esac
